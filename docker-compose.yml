# =============================================================================
# NETWORKS
# =============================================================================
networks:
  xencrypt-network:
    driver: bridge
    name: xencrypt-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
    driver: local
  server-data:
    driver: local
  agent-modern-data:
    driver: local
  agent-legacy-data:
    driver: local
  agent-mixed-data:
    driver: local


# =============================================================================
# 🚀 XENCRYPT - DOCKER SERVICE PORT & COMMAND CHEAT SHEET (NOTES INSIDE YML)
# =============================================================================


# ---------------------------------------------------------------------------
# ✅ EXTERNALLY EXPOSED PORTS (SYSTEM ACCESS)
# ---------------------------------------------------------------------------

# SERVICE NAME            CONTAINER NAME           EXTERNAL PORT → INTERNAL PORT
# -------------------------------------------------------------------------------
# PostgreSQL              postgres                 ❌ Internal only (5432)
# System Scan API         system-scan              9000 → 9000
# Crypto Scanner          crypto-scanner           8000 → 8000
# DB Service              db-service-1             8001 → 8001
# Repo Scanner            repo-scanner             8003 → 8001
# Onboarding Service      onboarding               8008 → 8008
# Frontend (Web UI)       frontend                 3000 → 8080
# Adminer (DB UI)         adminer                  8080 → 8080


# =============================================================================
# ✅ SINGLE COMMAND TO BUILD & START EVERYTHING (FULL SYSTEM)
# =============================================================================
# docker compose up -d --build


# =============================================================================
# ✅ STOP EVERYTHING (WITHOUT DELETING DATA)
# =============================================================================
# docker compose down


# =============================================================================
# ✅ STOP EVERYTHING + DELETE VOLUMES (FULL CLEAN RESET)
# ⚠️ THIS WILL DELETE DATABASE & ALL PERSISTENT DATA
# =============================================================================
# docker compose down -v


# =============================================================================
# ✅ FULL SYSTEM BUILD (NO CACHE) + UP
# =============================================================================
# docker compose build --no-cache
# docker compose up -d


# =============================================================================
# ✅ SERVICE-WISE BUILD & START (SEPARATE COMMANDS)
# =============================================================================

# 1️⃣ POSTGRES
# docker compose up -d postgres

# 2️⃣ DB SERVICE
# docker compose build db-service
# docker compose up -d db-service

# 3️⃣ SYSTEM SCAN API
# docker compose build system-scan
# docker compose up -d system-scan

# 4️⃣ CRYPTO SCANNER
# docker compose build crypto-scanner
# docker compose up -d crypto-scanner

# 5️⃣ REPO SCANNER
# docker compose build repo-scanner
# docker compose up -d repo-scanner

# 6️⃣ ONBOARDING
# docker compose build onboarding
# docker compose up -d onboarding

# 7️⃣ FRONTEND
# docker compose build frontend
# docker compose up -d frontend

# 8️⃣ ADMINER
# docker compose up -d adminer

# 9️⃣ LINUX AGENT - MODERN
# docker compose build linux-agent-modern
# docker compose up -d linux-agent-modern

# 🔟 LINUX AGENT - LEGACY
# docker compose build linux-agent-legacy
# docker compose up -d linux-agent-legacy

# 1️⃣1️⃣ LINUX AGENT - MIXED
# docker compose build linux-agent-mixed
# docker compose up -d linux-agent-mixed


# =============================================================================
# ✅ SINGLE-LINE SERVICE-WISE BUILD + RUN (NO SEPARATE BUILD)
# =============================================================================

# docker compose up -d --build postgres
# docker compose up -d --build db-service
# docker compose up -d --build system-scan
# docker compose up -d --build crypto-scanner
# docker compose up -d --build repo-scanner
# docker compose up -d --build onboarding
# docker compose up -d --build frontend
# docker compose up -d --build adminer
# docker compose up -d --build linux-agent-modern
# docker compose up -d --build linux-agent-legacy
# docker compose up -d --build linux-agent-mixed


# =============================================================================
# ✅ SEE LOGS (SERVICE-WISE)
# =============================================================================

# docker compose logs -f postgres
# docker compose logs -f db-service
# docker compose logs -f system-scan
# docker compose logs -f crypto-scanner
# docker compose logs -f repo-scanner
# docker compose logs -f onboarding
# docker compose logs -f frontend
# docker compose logs -f adminer
# docker compose logs -f linux-agent-modern
# docker compose logs -f linux-agent-legacy
# docker compose logs -f linux-agent-mixed


# =============================================================================
# ✅ SEE ONLY LAST 50 LOG LINES
# =============================================================================
# docker compose logs --tail=50 -f system-scan


# =============================================================================
# ✅ ENTER INTO A CONTAINER (SHELL)
# =============================================================================

# docker exec -it postgres sh
# docker exec -it db-service-1 sh
# docker exec -it system-scan sh
# docker exec -it crypto-scanner sh
# docker exec -it repo-scanner sh
# docker exec -it onboarding sh
# docker exec -it frontend sh


# =============================================================================
# ✅ RESTART ANY SINGLE SERVICE
# =============================================================================

# docker compose restart postgres
# docker compose restart db-service
# docker compose restart system-scan
# docker compose restart crypto-scanner
# docker compose restart repo-scanner
# docker compose restart onboarding
# docker compose restart frontend
# docker compose restart adminer
# docker compose restart linux-agent-modern
# docker compose restart linux-agent-legacy
# docker compose restart linux-agent-mixed


# =============================================================================
# ✅ STOP & REMOVE SINGLE SERVICE
# =============================================================================
# docker compose stop system-scan
# docker compose rm -f system-scan


# =============================================================================
# ✅ CHECK HEALTH STATUS OF ALL SERVICES
# =============================================================================
# docker compose ps


# =============================================================================
# ✅ CLEAN ALL UNUSED IMAGES, NETWORKS & VOLUMES (DANGER)
# =============================================================================
# docker system prune -a --volumes -f


# =============================================================================
# ✅ DATABASE LOGIN (POSTGRES)
# =============================================================================
# docker exec -it postgres psql -U scanuser


# =============================================================================
# ✅ SYSTEM ACCESS URLS
# =============================================================================
# Frontend UI        → http://localhost:3000
# System Scan API    → http://localhost:9000
# Crypto Scanner API → http://localhost:8000
# DB Service API     → http://localhost:8001
# Repo Scanner API   → http://localhost:8003
# Onboarding API     → http://localhost:8008
# Adminer DB UI      → http://localhost:8080


