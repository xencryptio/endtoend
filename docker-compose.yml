  #       condition: service_healthy
  #   environment:
  #     - AGENT_PROFILE=modern
  #     - API_BASE_URL=http://system-scan:9000
  #     - POLL_INTERVAL=10
  #     - AGENT_NAME=ubuntu-modern-agent
  #   networks:
  #     - xencrypt-network
  #   restart: unless-stopped
  #   privileged: false
