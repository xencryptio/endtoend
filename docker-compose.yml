# =============================================================================
# CRYPTO AUDIT SYSTEM - COMPLETE DOCKER COMPOSE
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # POSTGRESQL DATABASE
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: scanuser
      POSTGRES_PASSWORD: scanpass
    volumes:
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    networks:
      - xencrypt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # UNIVERSAL SCORING SERVICE
  # ---------------------------------------------------------------------------
  universal-scoring-service:
    build:
      context: ./universal-scoring-service
      dockerfile: Dockerfile
    container_name: universal-scoring-service
    ports:
      - "9500:9500"
    networks:
      - xencrypt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9500/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # CENTRAL API SERVER
  # ---------------------------------------------------------------------------
  system-scan:
    build:
      context: ./system-scaner
      dockerfile: Dockerfile
    container_name: system-scan
    ports:
      - "9000:9000"
    volumes:
      - server-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://scanuser:scanpass@postgres:5432/system_scanner_db
      - LOG_LEVEL=DEBUG
      - SCORING_SERVICE_URL=http://universal-scoring-service:9500
    networks:
      - xencrypt-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-service:
        condition: service_healthy
      universal-scoring-service:
        condition: service_healthy
    command: ["/usr/local/bin/wait-for-db.sh", "postgres", "python", "api_server.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/admin/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ======================
  # CRYPTO SCANNER SERVICE
  # ======================
  crypto-scanner:
    build:
      context: ./scan-service
      dockerfile: Dockerfile
    container_name: crypto-scanner
    ports:
      - "8000:8000"
    volumes:
      - ./scan-service:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DB_SERVICE_URL=http://db-service:8001
      - DATABASE_URL=postgresql://scanuser:scanpass@postgres:5432/crypto_scanner_db
      - UVICORN_LOG_LEVEL=debug
      - SCORING_SERVICE_URL=http://universal-scoring-service:9500
      - EXTERNAL_TLS_SCANNER_URL=http://ssl-tls-scanner-new:8010
      - USE_INTERNAL_SCANNER=false
    networks:
      - xencrypt-network
    depends_on:
      db-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      universal-scoring-service:
        condition: service_healthy
      ssl-tls-scanner-new:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ================================
  # NEW SSL/TLS SCANNER SERVICE
  # ================================
  ssl-tls-scanner-new:
    build:
      context: ./ssl-tls-scanner_new
      dockerfile: Dockerfile
    container_name: ssl-tls-scanner-new
    ports:
      - "8010:8010"
    networks:
      - xencrypt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ================================
  # OQS PQ SCANNER (ML-KEM/Kyber Detection)
  # ================================
  oqs-pq-scanner:
    build:
      context: ./oqs-pq-scanner
      dockerfile: Dockerfile
    container_name: oqs-pq-scanner
    ports:
      - "8011:8011"
    networks:
      - xencrypt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # DATABASE SERVICE
  # ---------------------------------------------------------------------------
  db-service:
    build:
      context: ./db-service
      dockerfile: Dockerfile
    container_name: db-service-1
    ports:
      - "8001:8001"
    volumes:
      - ./db-service:/app
    environment:
      - PYTHONUNBUFFERED=1
      # Main database
      - DATABASE_URL=postgresql://scanuser:scanpass@postgres:5432/scandb
      # Additional databases for CSV export
      - REPO_SCANNER_DB_URL=postgresql://scanuser:scanpass@postgres:5432/repo_scanner_db
      - SYSTEM_SCANNER_DB_URL=postgresql://scanuser:scanpass@postgres:5432/system_scanner_db
      - UVICORN_LOG_LEVEL=debug
    networks:
      - xencrypt-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # REPO SCANNER SERVICE
  # ---------------------------------------------------------------------------
  repo-scanner:
    build:
      context: ./repo_scanner
      dockerfile: Dockerfile
    ports:
      - "8003:8001"
    volumes:
      - ./repo_scanner:/app
    environment:
      - DATABASE_URL=postgresql://scanuser:scanpass@postgres:5432/repo_scanner_db
      - UVICORN_LOG_LEVEL=debug
      - SCORING_SERVICE_URL=http://universal-scoring-service:9500
    networks:
      - xencrypt-network
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      db-service:
        condition: service_healthy
      universal-scoring-service:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # ONBOARDING / BATCH SCANNER SERVICE (FIXED)
  # ===========================================================================
  onboarding:
    build:
      context: ./onboarding
      dockerfile: Dockerfile
    container_name: onboarding
    ports:
      - "8008:8008"
    environment:
      - PYTHONUNBUFFERED=1
      - TLS_SCANNER_URL=http://crypto-scanner:8000
      - REPO_SCANNER_URL=http://repo-scanner:8001  # ✅ Correct internal port
      - MAX_CONCURRENT_SCANS=5
      - GITHUB_API_TIMEOUT=30.0
    volumes:
      - ./onboarding/app:/app/app
    restart: unless-stopped
    networks:
      - xencrypt-network
    depends_on:
      crypto-scanner:
        condition: service_healthy  # ✅ Wait for healthy
      repo-scanner:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ======================
  # ADMINER (DB WEB UI)
  # ======================
  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - xencrypt-network
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # FRONTEND SERVICE
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:8080"
    environment:
      - VITE_HOST=${VM_HOST}
      - VITE_DB_API_URL=http://${VM_HOST}:8001
      - VITE_SCAN_API_URL=http://${VM_HOST}:8000
      - VITE_SYSTEM_SCAN_API_URL=http://${VM_HOST}:9000
      - VITE_REPO_SCAN_API_URL=http://${VM_HOST}:8003
      - VITE_ONBOARDING_API_URL=http://${VM_HOST}:8008
    networks:
      - xencrypt-network
    depends_on:
      system-scan:
        condition: service_healthy
      db-service:
        condition: service_healthy
      crypto-scanner:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

