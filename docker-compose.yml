version: '3.8'

# =============================================================================
# CRYPTO AUDIT SYSTEM - COMPLETE DOCKER COMPOSE
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # POSTGRESQL DATABASE
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: scanuser
      POSTGRES_PASSWORD: scanpass
    volumes:
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    networks:
      - xencrypt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # CENTRAL API SERVER
  # ---------------------------------------------------------------------------
  system-scan:
    build:
      context: ./system-scaner
      dockerfile: Dockerfile
    container_name: system-scan
    ports:
      - "9000:9000"
    volumes:
      - server-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://scanuser:scanpass@postgres:5432/system_scanner_db
      - LOG_LEVEL=DEBUG
    networks:
      - xencrypt-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-service:
        condition: service_healthy
    command: ["/usr/local/bin/wait-for-db.sh", "postgres", "python", "api_server.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/admin/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ======================
  # CRYPTO SCANNER SERVICE
  # ======================
  crypto-scanner:
    build:
      context: ./scan-service
      dockerfile: Dockerfile
    container_name: crypto-scanner
    ports:
      - "8000:8000"
    volumes:
      - ./scan-service:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DB_SERVICE_URL=http://db-service:8001
      - DATABASE_URL=postgresql://scanuser:scanpass@postgres:5432/crypto_scanner_db
      - UVICORN_LOG_LEVEL=debug
    networks:
      - xencrypt-network
    depends_on:
      db-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # DATABASE SERVICE
  # ---------------------------------------------------------------------------
  db-service:
    build:
      context: ./db-service
      dockerfile: Dockerfile
    container_name: db-service-1
    ports:
      - "8001:8001"
    volumes:
      - ./db-service:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://scanuser:scanpass@postgres:5432/scandb
      - UVICORN_LOG_LEVEL=debug
    networks:
      - xencrypt-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # REPO SCANNER SERVICE
  # ---------------------------------------------------------------------------
  repo-scanner:
    build:
      context: ./repo_scanner
      dockerfile: Dockerfile
    ports:
      - "8003:8001"
    volumes:
      - ./repo_scanner:/app
    environment:
      - DATABASE_URL=postgresql://scanuser:scanpass@postgres:5432/repo_scanner_db
      - UVICORN_LOG_LEVEL=debug
    networks:
      - xencrypt-network
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      db-service:
        condition: service_healthy

  # ===========================================================================
  # ONBOARDING / BATCH SCANNER SERVICE (FIXED)
  # ===========================================================================
  onboarding:
    build:
      context: ./onboarding
      dockerfile: Dockerfile
    container_name: onboarding
    ports:
      - "8008:8008"
    environment:
      - PYTHONUNBUFFERED=1
      - TLS_SCANNER_URL=http://crypto-scanner:8000
      - REPO_SCANNER_URL=http://repo-scanner:8001  # ✅ Correct internal port
      - MAX_CONCURRENT_SCANS=5
      - GITHUB_API_TIMEOUT=30.0
    volumes:
      - ./onboarding/app:/app/app
    restart: unless-stopped
    networks:
      - xencrypt-network
    depends_on:
      crypto-scanner:
        condition: service_healthy  # ✅ Wait for healthy
      repo-scanner:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ======================
  # ADMINER (DB WEB UI)
  # ======================
  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - xencrypt-network
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # FRONTEND SERVICE
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:8080"
    networks:
      - xencrypt-network
    depends_on:
      system-scan:
        condition: service_healthy
      db-service:
        condition: service_healthy
      crypto-scanner:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # LINUX AGENT #1 - MODERN
  # ---------------------------------------------------------------------------
  linux-agent-modern:
    build:
      context: ./system-scaner/agents/linux
      dockerfile: Dockerfile.modern
      args:
        API_SERVER: http://system-scan:9000
    container_name: linux-agent-modern
    hostname: ubuntu-modern-agent
    depends_on:
      system-scan:
        condition: service_healthy
    environment:
      - AGENT_PROFILE=modern
      - API_BASE_URL=http://system-scan:9000
      - POLL_INTERVAL=10
      - AGENT_NAME=ubuntu-modern-agent
    networks:
      - xencrypt-network
    restart: unless-stopped
    privileged: false
    cap_add:
      - SYS_ADMIN
    volumes:
      - agent-modern-data:/var/lib/crypto_agent

  # ---------------------------------------------------------------------------
  # LINUX AGENT #2 - LEGACY
  # ---------------------------------------------------------------------------
  linux-agent-legacy:
    build:
      context: ./system-scaner/agents/linux
      dockerfile: Dockerfile.legacy
      args:
        API_SERVER: http://system-scan:9000
    container_name: linux-agent-legacy
    hostname: debian-legacy-agent
    depends_on:
      system-scan:
        condition: service_healthy
    environment:
      - AGENT_PROFILE=legacy
      - API_BASE_URL=http://system-scan:9000
      - POLL_INTERVAL=10
      - AGENT_NAME=debian-legacy-agent
    networks:
      - xencrypt-network
    restart: unless-stopped
    privileged: false
    cap_add:
      - SYS_ADMIN
    volumes:
      - agent-legacy-data:/var/lib/crypto_agent

  # ---------------------------------------------------------------------------
  # LINUX AGENT #3 - MIXED
  # ---------------------------------------------------------------------------
  linux-agent-mixed:
    build:
      context: ./system-scaner/agents/linux
      dockerfile: Dockerfile.mixed
      args:
        API_SERVER: http://system-scan:9000
    container_name: linux-agent-mixed
    hostname: alpine-mixed-agent
    depends_on:
      system-scan:
        condition: service_healthy
    environment:
      - AGENT_PROFILE=mixed
      - API_BASE_URL=http://system-scan:9000
      - POLL_INTERVAL=10
      - AGENT_NAME=alpine-mixed-agent
    networks:
      - xencrypt-network
    restart: unless-stopped
    privileged: false
    cap_add:
      - SYS_ADMIN
    volumes:
      - agent-mixed-data:/var/lib/crypto_agent

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  xencrypt-network:
    driver: bridge
    name: xencrypt-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
    driver: local
  server-data:
    driver: local
  agent-modern-data:
    driver: local
  agent-legacy-data:
    driver: local
  agent-mixed-data:
    driver: local