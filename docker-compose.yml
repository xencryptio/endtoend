  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "5"

  # # ---------------------------------------------------------------------------
  # # LINUX AGENT #3 - MIXED (Alpine)
  # # ---------------------------------------------------------------------------
  # linux-agent-mixed:
  #   build:
  #     context: ./system-scaner/agents/linux
  #     dockerfile: Dockerfile.mixed
  #     args:
  #       API_SERVER: http://system-scan:9000
  #   container_name: linux-agent-mixed
  #   hostname: alpine-mixed-agent
  #   depends_on:
  #     system-scan:
  #       condition: service_healthy
  #   environment:
  #     - AGENT_PROFILE=mixed
  #     - API_BASE_URL=http://system-scan:9000
  #     - POLL_INTERVAL=10
  #     - AGENT_NAME=alpine-mixed-agent
  #   networks:
  #     - xencrypt-network
  #   restart: unless-stopped
  #   privileged: false
  #   cap_add:
  #     - SYS_ADMIN
  #   volumes:
  #     - agent-mixed-data:/var/lib/crypto_agent
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "5"

  # ===========================================================================
  # 🆕 ELASTICSEARCH - Document store for all scan results (audit trail)
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"
    networks:
      - xencrypt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # 🆕 KIBANA - Visualization UI for Elasticsearch
  # ===========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - XPACK_REPORTING_ENABLED=false
      - SERVER_PUBLICBASEURL=http://localhost:5601
    ports:
      - "5601:5601"
    networks:
      - xencrypt-network
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # 🆕 ELK INDEXER - Writes scan results into Elasticsearch (audit-friendly)
  # ===========================================================================
  elk-indexer:
    build:
      context: ./elk-indexer
      dockerfile: Dockerfile
    container_name: elk-indexer
    ports:
      - "9100:9100"
    environment:
      - PYTHONUNBUFFERED=1
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - xencrypt-network
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # 🆕 ELK QUERY API - Read API for React dashboards (reads from Elasticsearch)
  # ===========================================================================
  elk-query-api:
    build:
      context: ./elk-query-api
      dockerfile: Dockerfile
    container_name: elk-query-api
    ports:
      - "9101:9101"
    environment:
      - PYTHONUNBUFFERED=1
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - TLS_SCANNER_URL=http://crypto-scanner:8000
      - REPO_SCANNER_URL=http://repo-scanner:8001
      - SYSTEM_SCAN_URL=http://system-scan:9000
      - ALGO_BACKUPS_DIR=/app/backups
    volumes:
      # Algorithm-scores backup folder. baseline.json is the immutable golden
      # snapshot (git-tracked); snapshot-*.json files are user-created backups
      # that persist on the host even if the ES volume is wiped.
      - ./algo-backups:/app/backups
    networks:
      - xencrypt-network
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9101/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # 🆕 ELK SYNC - Polls existing scan APIs and pushes results into Elasticsearch
  # ===========================================================================
  elk-sync:
    build:
      context: ./elk-sync
      dockerfile: Dockerfile
    container_name: elk-sync
    environment:
      - PYTHONUNBUFFERED=1
      - ELK_INDEXER_URL=http://elk-indexer:9100
      - SCAN_API_URL=http://crypto-scanner:8000
      - REPO_API_URL=http://repo-scanner:8001
      - SYSTEM_API_URL=http://system-scan:9000
      - POLL_INTERVAL_SECONDS=60
    networks:
      - xencrypt-network
    restart: unless-stopped
    depends_on:
      elk-indexer:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # 🆕 KIBANA BOOTSTRAP - One-shot import of data views + dashboards on start
  # ===========================================================================
  # Runs whenever the stack comes up. Idempotent (overwrite=true), so it is
  # safe to re-run. Ensures the analyst dashboard is restored automatically
  # after `docker compose down -v` or any volume wipe.
  kibana-bootstrap:
    build:
      context: ./kibana-bootstrap
      dockerfile: Dockerfile
    container_name: kibana-bootstrap
    environment:
      - KIBANA_URL=http://kibana:5601
      - MAX_WAIT_SECONDS=600
      - POLL_INTERVAL_SECONDS=5
    volumes:
      - ./elk-indexer/kibana-objects.ndjson:/import/01-data-views.ndjson:ro
      - ./elk-indexer/kibana-analyst-dashboard.ndjson:/import/02-analyst-dashboard.ndjson:ro
    networks:
      - xencrypt-network
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  xencrypt-network:
    driver: bridge
    name: xencrypt-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  scanner-data:
    driver: local
  server-data:
    driver: local
  agent-modern-data:
    driver: local
  agent-legacy-data:
    driver: local
  agent-mixed-data:
    driver: local
  elasticsearch-data:
    driver: local


# =============================================================================
# 🚀 XENCRYPT - DOCKER SERVICE PORT & COMMAND CHEAT SHEET (NOTES INSIDE YML)
# =============================================================================


# ---------------------------------------------------------------------------
# ✅ EXTERNALLY EXPOSED PORTS (SYSTEM ACCESS)
# ---------------------------------------------------------------------------

# SERVICE NAME            CONTAINER NAME           EXTERNAL PORT → INTERNAL PORT
# -------------------------------------------------------------------------------
# System Scan API         system-scan              9000 → 9000
# Crypto Scanner          crypto-scanner           8000 → 8000
# DB Service              db-service-1             8001 → 8001
# Repo Scanner            repo-scanner             8003 → 8001
# Onboarding Service      onboarding               8008 → 8008
# Frontend (Web UI)       frontend                 3000 → 8080
# Elasticsearch           elasticsearch            9201 → 9200
# Kibana                  kibana                   5601 → 5601
# ELK Indexer             elk-indexer              9100 → 9100
# ELK Query API           elk-query-api            9101 → 9101


# =============================================================================
# ✅ SINGLE COMMAND TO BUILD & START EVERYTHING (FULL SYSTEM)
# =============================================================================
# docker compose up -d --build


# =============================================================================
# ✅ STOP EVERYTHING (WITHOUT DELETING DATA)
# =============================================================================
# docker compose down


# =============================================================================
# ✅ STOP EVERYTHING + DELETE VOLUMES (FULL CLEAN RESET)
# ⚠️ THIS WILL DELETE DATABASE & ALL PERSISTENT DATA
# =============================================================================
# docker compose down -v


# =============================================================================
# ✅ FULL SYSTEM BUILD (NO CACHE) + UP
# =============================================================================
# docker compose build --no-cache
# docker compose up -d


# =============================================================================
# ✅ SERVICE-WISE BUILD & START (SEPARATE COMMANDS)
# =============================================================================

# 1⃣⃣ DB SERVICE
# docker compose build db-service
# docker compose up -d db-service

# 3️⃣ SYSTEM SCAN API
# docker compose build system-scan
# docker compose up -d system-scan

# 4️⃣ CRYPTO SCANNER
# docker compose build crypto-scanner
# docker compose up -d crypto-scanner

# 5️⃣ REPO SCANNER
# docker compose build repo-scanner
# docker compose up -d repo-scanner

# 6️⃣ ONBOARDING
# docker compose build onboarding
# docker compose up -d onboarding

# 7️⃣ FRONTEND
# docker compose build frontend
# docker compose up -d frontend


# 9️⃣ LINUX AGENT - MODERN
# docker compose build linux-agent-modern
# docker compose up -d linux-agent-modern

# 🔟 LINUX AGENT - LEGACY
# docker compose build linux-agent-legacy
# docker compose up -d linux-agent-legacy

# 1️⃣1️⃣ LINUX AGENT - MIXED
# docker compose build linux-agent-mixed
# docker compose up -d linux-agent-mixed


# =============================================================================
# ✅ SINGLE-LINE SERVICE-WISE BUILD + RUN (NO SEPARATE BUILD)
# =============================================================================

# docker compose up -d --build db-service
# docker compose up -d --build system-scan
# docker compose up -d --build crypto-scanner
# docker compose up -d --build repo-scanner
# docker compose up -d --build onboarding
# docker compose up -d --build frontend
# docker compose up -d --build linux-agent-modern
# docker compose up -d --build linux-agent-legacy
# docker compose up -d --build linux-agent-mixed


# =============================================================================
# ✅ SEE LOGS (SERVICE-WISE)
# =============================================================================

# docker compose logs -f db-service
# docker compose logs -f system-scan
# docker compose logs -f crypto-scanner
# docker compose logs -f repo-scanner
# docker compose logs -f onboarding
# docker compose logs -f frontend
# docker compose logs -f linux-agent-modern
# docker compose logs -f linux-agent-legacy
# docker compose logs -f linux-agent-mixed


# =============================================================================
# ✅ SEE ONLY LAST 50 LOG LINES
# =============================================================================
# docker compose logs --tail=50 -f system-scan


# =============================================================================
# ✅ ENTER INTO A CONTAINER (SHELL)
# =============================================================================

# docker exec -it db-service-1 sh
# docker exec -it system-scan sh
# docker exec -it crypto-scanner sh
# docker exec -it repo-scanner sh
# docker exec -it onboarding sh
# docker exec -it frontend sh


# =============================================================================
# ✅ RESTART ANY SINGLE SERVICE
# =============================================================================

# docker compose restart db-service
# docker compose restart system-scan
# docker compose restart crypto-scanner
# docker compose restart repo-scanner
# docker compose restart onboarding
# docker compose restart frontend
# docker compose restart linux-agent-modern
# docker compose restart linux-agent-legacy
# docker compose restart linux-agent-mixed


# =============================================================================
# ✅ STOP & REMOVE SINGLE SERVICE
# =============================================================================
# docker compose stop system-scan
# docker compose rm -f system-scan


# =============================================================================
# ✅ CHECK HEALTH STATUS OF ALL SERVICES
# =============================================================================
# docker compose ps


# =============================================================================
# ✅ CLEAN ALL UNUSED IMAGES, NETWORKS & VOLUMES (DANGER)
# =============================================================================
# docker system prune -a --volumes -f


# =============================================================================
# ✅ DATABASE
# =============================================================================
# PostgreSQL has been removed. State now lives in SQLite files under the
# `scanner-data` volume. Inspect them via:
#   docker compose exec db-service ls /data
#   docker compose exec db-service sqlite3 /data/scandb.db '.tables'


# =============================================================================
# ✅ SYSTEM ACCESS URLS
# =============================================================================
# Frontend UI        → http://localhost:3000
# System Scan API    → http://localhost:9000
# Crypto Scanner API → http://localhost:8000
# DB Service API     → http://localhost:8001
# Repo Scanner API   → http://localhost:8003
# Onboarding API     → http://localhost:8008
# Elasticsearch      → http://localhost:9201
# Kibana             → http://localhost:5601
# ELK Query API      → http://localhost:9101


# =============================================================================
# ✅ END OF DOCKER NOTES SECTION
# =============================================================================
