version: '3.8'

services:
  # =========================================================================
  # Windows Crypto Agent - Quantum-Safe with FIPS 140-2 Mode
  # =========================================================================
  # REQUIREMENTS:
  #   - Docker Desktop with Windows containers enabled
  #   - Or Docker running on Windows Server with Windows kernel
  #   - Minimum 4GB RAM, 20GB disk space for image/container
  #
  # BUILD:
  #   docker-compose -f docker-compose.windows.yml build
  #
  # RUN:
  #   docker-compose -f docker-compose.windows.yml up -d windows-crypto-agent
  #
  # LOGS:
  #   docker-compose -f docker-compose.windows.yml logs -f windows-crypto-agent
  #
  # SCAN:
  #   docker exec windows-crypto-agent powershell -Command \
  #     "& 'C:\CryptoAgent\windows_audit.py' | ConvertTo-Json"
  # =========================================================================

  windows-crypto-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: quantum-safe-windows-agent:latest
    container_name: quantum-safe-windows-crypto-agent
    
    # Network: shared with Linux services for scanning
    networks:
      - xencrypt-network
    
    # Environment: Point to system-scaner API
    environment:
      - AGENT_API_URL=http://system-scaner-api:9000
      - FIPS_MODE_ENABLED=1
      - TLS_MIN_VERSION=TLS12
      - TLS_MAX_VERSION=TLS13
      - QUANTUM_SAFE_READY=1
    
    # Volumes: Persist configuration and logs
    volumes:
      - crypto-agent-data:C:\ProgramData\CryptoAgent
      - crypto-agent-logs:C:\CryptoAgent\logs
    
    # Resource limits (Windows containers use Hyper-V isolation by default)
    # Adjust based on your host capacity
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    # Restart policy
    restart: unless-stopped
    
    # Healthcheck: Verify FIPS and Crypto Configuration
    healthcheck:
      test: powershell -Command "try { `$f=(Get-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Lsa\FipsAlgorithmPolicy' -Name Enabled -ErrorAction SilentlyContinue).Enabled; `$t=(Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.2\Server' -Name Enabled -ErrorAction SilentlyContinue).Enabled; if (`$f -eq 1 -and `$t -eq 1) { Exit 0 } else { Exit 1 } } catch { Exit 1 }"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  crypto-agent-data:
    driver: local
  crypto-agent-logs:
    driver: local

networks:
  xencrypt-network:
    driver: overlay
    external: true
